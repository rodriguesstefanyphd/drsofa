# Publica o site no GitHub Pages a cada commit no main.
# O ambiente github-pages só aceita publicações do branch principal, por isso
# o main é o branch que está no ar.
name: Publicar pré-visualização no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; não cancela a que estiver a meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ligar o Pages, se ainda não estiver ligado
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
