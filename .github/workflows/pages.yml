# Publica o site no GitHub Pages a cada commit neste branch.
# O passo configure-pages com enablement:true liga o Pages automaticamente na
# primeira execução, sem ser preciso mexer nas definições do repositório.
name: Publicar pré-visualização no GitHub Pages

on:
  push:
    branches: [claude/consent-gtm-setup-bh959t]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; não cancela a que estiver a meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ligar o Pages, se ainda não estiver ligado
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
